apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-oracle-cost-budget
  labels:
    cost.stellar.org/team: platform
    cost.stellar.org/cost-center: stellar-oracle
spec:
  groups:
    - name: stellar-oracle.cost
      interval: 5m
      rules:
        - record: stellar_oracle:requested_monthly_cost_usd_by_service_team
          expr: |
            sum by (label_cost_stellar_org_service, label_cost_stellar_org_team) (
              kube_pod_container_resource_requests{namespace="stellar-oracle-prod",resource="cpu"}
              * on (namespace, pod) group_left (label_cost_stellar_org_service, label_cost_stellar_org_team)
              kube_pod_labels{namespace="stellar-oracle-prod"}
            ) * 0.04 * 730
            + sum by (label_cost_stellar_org_service, label_cost_stellar_org_team) (
              kube_pod_container_resource_requests{namespace="stellar-oracle-prod",resource="memory"}
              * on (namespace, pod) group_left (label_cost_stellar_org_service, label_cost_stellar_org_team)
              kube_pod_labels{namespace="stellar-oracle-prod"}
            ) / 1024 / 1024 / 1024 * 0.005 * 730
          labels:
            environment: production
            cost_center: stellar-oracle
        - record: stellar_oracle:requested_monthly_cost_usd
          expr: |
            sum(kube_pod_container_resource_requests{namespace="stellar-oracle-prod",resource="cpu"}) * 0.04 * 730
            + sum(kube_pod_container_resource_requests{namespace="stellar-oracle-prod",resource="memory"}) / 1024 / 1024 / 1024 * 0.005 * 730
            + sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="stellar-oracle-prod"}) / 1024 / 1024 / 1024 * 0.17
          labels:
            environment: production
            cost_center: stellar-oracle
        - alert: StellarOracleCostBudgetWarning
          expr: stellar_oracle:requested_monthly_cost_usd > 24
          for: 30m
          labels:
            severity: warning
            team: platform
            cost_center: stellar-oracle
          annotations:
            summary: Stellar Oracle projected monthly cost is above 80% of budget
            description: Requested-capacity run rate is {{ $value | humanize }} USD against the 30 USD monthly budget.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/cost-optimization.md
        - alert: StellarOracleCostBudgetExceeded
          expr: stellar_oracle:requested_monthly_cost_usd > 30
          for: 15m
          labels:
            severity: critical
            team: platform
            cost_center: stellar-oracle
          annotations:
            summary: Stellar Oracle projected monthly cost exceeds budget
            description: Requested-capacity run rate is {{ $value | humanize }} USD and exceeds the 30 USD monthly budget.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/cost-optimization.md
