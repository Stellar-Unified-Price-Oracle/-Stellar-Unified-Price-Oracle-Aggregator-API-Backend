apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stellar-oracle-prod-ap-southeast-1

resources:
  - namespace.yaml
  - ../../base
  - ../../base/multi-region

patches:
  - path: ../../overlays/prod/configmap-patch.yaml
  - target:
      kind: ConfigMap
      name: stellar-oracle-config
    patch: |-
      - op: replace
        path: /data/PRIMARY_REGION
        value: ap-southeast-1
      - op: replace
        path: /data/SECONDARY_REGION
        value: us-east-1
      - op: replace
        path: /data/REPLICATION_TARGET
        value: us-east-1
  - target:
      kind: ConfigMap
      name: stellar-oracle-config
    patch: |-
      - op: add
        path: /data/REGION_LATENCY_ZONE
        value: apac
      - op: add
        path: /data/GEO_DNS_WEIGHT
        value: "100"
  - target:
      kind: Deployment
      name: api-stable
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: api-canary
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: aggregator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - path: geo-config-patch.yaml
    target:
      kind: ConfigMap
      name: stellar-oracle-global-config
  - path: failover-policy-patch.yaml
    target:
      kind: ConfigMap
      name: region-failover-policy
