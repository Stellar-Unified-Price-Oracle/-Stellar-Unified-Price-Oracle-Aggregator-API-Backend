apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stellar-oracle-prod

resources:
  - namespace.yaml
  - ../../base
  - ../../cost-optimization

patches:
  - path: configmap-patch.yaml
  - target:
      kind: Deployment
      name: api-stable
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1service
        value: api
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1team
        value: platform
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1environment
        value: production
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
  - target:
      kind: Deployment
      name: api-canary
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1service
        value: api
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1team
        value: platform
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1environment
        value: production
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
  - target:
      kind: Deployment
      name: aggregator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1service
        value: aggregator
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1team
        value: oracle
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1environment
        value: production
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 75m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 192Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 400m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
  - target:
      kind: StatefulSet
      name: timescaledb
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1service
        value: timescaledb
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1team
        value: data
      - op: add
        path: /spec/template/metadata/labels/cost.stellar.org~1environment
        value: production
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 750m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
