# Generated by scripts/generate-slo-rules.mjs from monitoring/slo.yml; do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-oracle-slos
  labels:
    app: stellar-price-oracle
spec:
  groups:
    - name: stellar-oracle-slos
      interval: 1m
      rules:
        - record: stellar_slo:api-availability:good_events:rate5m
          expr: sum(rate(http_requests_total{job="stellar-api",status!~"5.."}[5m]))
        - record: stellar_slo:api-availability:total_events:rate5m
          expr: sum(rate(http_requests_total{job="stellar-api"}[5m]))
        - record: stellar_slo:api-availability:error_ratio:rate5m
          expr: 1 - (stellar_slo:api-availability:good_events:rate5m / clamp_min(stellar_slo:api-availability:total_events:rate5m, 1e-12))
        - alert: ApiAvailabilityFastBurn
          expr: stellar_slo:api-availability:error_ratio:rate5m > 0.0144
          for: 1h
          labels:
            severity: critical
            slo: api-availability
          annotations:
            summary: api-availability error budget burn is above 14.4x
            budget_exhaustion: 2%
        - alert: ApiAvailabilitySlowBurn
          expr: stellar_slo:api-availability:error_ratio:rate5m > 0.006
          for: 6h
          labels:
            severity: warning
            slo: api-availability
          annotations:
            summary: api-availability error budget burn is above 6x
            budget_exhaustion: 5%
        - record: stellar_slo:api-latency:good_events:rate5m
          expr: sum(rate(http_request_duration_seconds_bucket{job="stellar-api",le="1"}[5m]))
        - record: stellar_slo:api-latency:total_events:rate5m
          expr: sum(rate(http_request_duration_seconds_count{job="stellar-api"}[5m]))
        - record: stellar_slo:api-latency:error_ratio:rate5m
          expr: 1 - (stellar_slo:api-latency:good_events:rate5m / clamp_min(stellar_slo:api-latency:total_events:rate5m, 1e-12))
        - alert: ApiLatencyFastBurn
          expr: stellar_slo:api-latency:error_ratio:rate5m > 0.144
          for: 1h
          labels:
            severity: critical
            slo: api-latency
          annotations:
            summary: api-latency error budget burn is above 14.4x
            budget_exhaustion: 2%
        - alert: ApiLatencySlowBurn
          expr: stellar_slo:api-latency:error_ratio:rate5m > 0.06
          for: 6h
          labels:
            severity: warning
            slo: api-latency
          annotations:
            summary: api-latency error budget burn is above 6x
            budget_exhaustion: 5%
        - record: stellar_slo:price-freshness:good_events:rate5m
          expr: count(last_price_timestamp_seconds > time() - 120)
        - record: stellar_slo:price-freshness:total_events:rate5m
          expr: count(last_price_timestamp_seconds)
        - record: stellar_slo:price-freshness:error_ratio:rate5m
          expr: 1 - (stellar_slo:price-freshness:good_events:rate5m / clamp_min(stellar_slo:price-freshness:total_events:rate5m, 1e-12))
        - alert: PriceFreshnessFastBurn
          expr: stellar_slo:price-freshness:error_ratio:rate5m > 0.072
          for: 1h
          labels:
            severity: critical
            slo: price-freshness
          annotations:
            summary: price-freshness error budget burn is above 14.4x
            budget_exhaustion: 2%
        - alert: PriceFreshnessSlowBurn
          expr: stellar_slo:price-freshness:error_ratio:rate5m > 0.03
          for: 6h
          labels:
            severity: warning
            slo: price-freshness
          annotations:
            summary: price-freshness error budget burn is above 6x
            budget_exhaustion: 5%
