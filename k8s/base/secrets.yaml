apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stellar-oracle-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stellar-oracle-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_KEYS
      remoteRef: { key: stellar-oracle/runtime, property: API_KEYS }
    - secretKey: ADMIN_SECRET_KEY
      remoteRef: { key: stellar-oracle/runtime, property: ADMIN_SECRET_KEY }
    - secretKey: ORACLE_API_KEY
      remoteRef: { key: stellar-oracle/runtime, property: ORACLE_API_KEY }
    - secretKey: DATABASE_URL
      remoteRef: { key: stellar-oracle/runtime, property: DATABASE_URL }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: timescaledb-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: stellar-oracle/runtime, property: POSTGRES_PASSWORD }
