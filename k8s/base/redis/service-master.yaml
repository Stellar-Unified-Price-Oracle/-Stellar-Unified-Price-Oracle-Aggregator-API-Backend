apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: stellar-oracle-redis
  labels:
    app: redis-master
    app.kubernetes.io/part-of: stellar-oracle
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    app: redis-master
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
