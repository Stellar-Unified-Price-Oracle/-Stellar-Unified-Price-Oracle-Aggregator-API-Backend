apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-oracle-sla-alerts
  labels:
    app: stellar-price-oracle
    component: aggregator
spec:
  groups:
    - name: stellar-oracle.sla
      interval: 1m
      rules:
        - alert: OracleSourceSlaBreachRateHigh
          expr: |
            rate(oracle_source_sla_breaches_total[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Oracle source SLA breach rate is elevated ({{ $labels.source }})
            description: >
              Source {{ $labels.source }} has an SLA breach rate of
              {{ $value | humanize }}/s over the last 5 minutes.
              The SLA threshold is 5 seconds per request.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

        - alert: OracleSourceSlaBreachRateCritical
          expr: |
            rate(oracle_source_sla_breaches_total[5m]) > 0.2
          for: 3m
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: Oracle source SLA breach rate is critical ({{ $labels.source }})
            description: >
              Source {{ $labels.source }} has a critical SLA breach rate of
              {{ $value | humanize }}/s over the last 5 minutes.
              Immediate investigation required.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

        - alert: OracleSourceUptimeDegraded
          expr: |
            last_over_time(oracle_source_uptime_percent{source!=""}[10m]) < 95
          for: 10m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Oracle source {{ $labels.source }} uptime has dropped below 95%
            description: >
              Source {{ $labels.source }} has an uptime of
              {{ $value }}% over the last 10 minutes.
              Check source health and circuit breaker status.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

      - name: stellar-oracle.alerts
        interval: 1m
        rules:
          # Issue #583 — per-source API budget enforcement.
          - alert: OracleSourceBudgetApproaching
            expr: |
              max_over_time(oracle_api_budget_utilization_ratio{source!=""}[10m]) >= 0.80
                and
              max_over_time(oracle_api_budget_utilization_ratio{source!=""}[10m]) < 1.0
            for: 10m
            labels:
              severity: warning
              component: aggregator
            annotations:
              summary: Oracle source {{ $labels.source }} is approaching its daily API budget
              description: >
                Source {{ $labels.source }} has been above 80% of its daily API
                call budget for 10 minutes. The source keeps polling, but at
                100% it stops until the UTC rollover and aggregation quality
                degrades. Raise the budget (ORACLE_BUDGET_DAILY_CALLS_* or
                config/cost-model.json) or reduce the polling frequency.
              runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

          - alert: OracleSourceBudgetExhausted
            expr: |
              max_over_time(oracle_api_budget_utilization_ratio{source!=""}[5m]) >= 1.0
            for: 1m
            labels:
              severity: critical
              component: aggregator
            annotations:
              summary: Oracle source {{ $labels.source }} exhausted its daily API budget
              description: >
                Source {{ $labels.source }} hit its daily API call budget and is
                no longer being polled (oracle_source_budget_blocked_total is
                incrementing). Aggregation runs with fewer sources until the
                UTC rollover, widening the median spread. Raise the budget or
                accept the degraded quality deliberately.
              runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

          - alert: PriceFeedStale
            expr: |
              time() - oracle_last_price_update_timestamp_seconds > 120
            for: 2m
            labels:
              severity: warning
              component: api
            annotations:
              summary: Price feed stale for {{ $labels.asset }}
              description: 'Last price timestamp for {{ $labels.asset }} is more than 120s old.'
              runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-feed-stale.md

          - alert: PriceDeviation
            expr: |
              rate(stellar_oracle_anomalies_detected_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
              component: aggregator
            annotations:
              summary: Price anomaly detected for {{ $labels.asset }}
              description: 'Anomaly detector has flagged {{ $labels.asset }} in the last 5 minutes.'
              runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-anomaly.md

          - alert: CircuitBreakerOpen
            expr: |
              circuit_breaker_state{state="open"} == 1
            for: 30s
            labels:
              severity: critical
              component: aggregator
            annotations:
              summary: Circuit breaker open for {{ $labels.component }}
              description: 'Circuit breaker for {{ $labels.component }} is open; dependent requests are being short-circuited.'
              runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/circuit-breaker-open.md
