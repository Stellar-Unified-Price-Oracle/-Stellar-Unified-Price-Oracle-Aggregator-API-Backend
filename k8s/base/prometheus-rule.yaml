apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-oracle-sla-alerts
  labels:
    app: stellar-price-oracle
    component: aggregator
spec:
  groups:
    - name: stellar-oracle.sla
      interval: 1m
      rules:
        - alert: OracleSourceSlaBreachRateHigh
          expr: |
            rate(oracle_source_sla_breaches_total[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Oracle source SLA breach rate is elevated ({{ $labels.source }})
            description: >
              Source {{ $labels.source }} has an SLA breach rate of
              {{ $value | humanize }}/s over the last 5 minutes.
              The SLA threshold is 5 seconds per request.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

        - alert: OracleSourceSlaBreachRateCritical
          expr: |
            rate(oracle_source_sla_breaches_total[5m]) > 0.2
          for: 3m
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: Oracle source SLA breach rate is critical ({{ $labels.source }})
            description: >
              Source {{ $labels.source }} has a critical SLA breach rate of
              {{ $value | humanize }}/s over the last 5 minutes.
              Immediate investigation required.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

        - alert: OracleSourceUptimeDegraded
          expr: |
            last_over_time(oracle_source_uptime_percent{source!=""}[10m]) < 95
          for: 10m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Oracle source {{ $labels.source }} uptime has dropped below 95%
            description: >
              Source {{ $labels.source }} has an uptime of
              {{ $value }}% over the last 10 minutes.
              Check source health and circuit breaker status.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/oracle-source-down.md

    - name: stellar-oracle.provider-objectives
      interval: 5m
      rules:
        - alert: OracleProviderAvailabilityObjectiveMiss
          expr: |
            (
              sum by (source, asset) (increase(oracle_provider_fetches_total{outcome="available"}[30d]))
              / clamp_min(sum by (source, asset) (increase(oracle_provider_fetches_total[30d])), 1)
            ) < 0.995
            and on (source, asset)
            sum by (source, asset) (increase(oracle_provider_fetches_total[30d])) >= 100
          for: 15m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Provider availability objective missed for {{ $labels.source }} / {{ $labels.asset }}
            description: 'Validated fetch availability is below 99.5% over 30 days.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/provider-ecosystem.md

        - alert: OracleProviderLatencyObjectiveMiss
          expr: |
            (
              sum by (source, asset) (increase(oracle_source_request_duration_seconds_bucket{status="success",le="1"}[30d]))
              / clamp_min(sum by (source, asset) (increase(oracle_source_request_duration_seconds_count{status="success"}[30d])), 1)
            ) < 0.99
            and on (source, asset)
            sum by (source, asset) (increase(oracle_source_request_duration_seconds_count{status="success"}[30d])) >= 100
          for: 15m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Provider latency objective missed for {{ $labels.source }} / {{ $labels.asset }}
            description: 'Fewer than 99% of validated fetches completed within one second over 30 days.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/provider-ecosystem.md

        - alert: OracleProviderFreshnessObjectiveMiss
          expr: |
            avg_over_time((oracle_source_freshness_seconds <= bool (oracle_provider_cadence_seconds + 5))[30d:1m]) < 0.99
          for: 15m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Provider freshness objective missed for {{ $labels.source }} / {{ $labels.asset }}
            description: 'Fewer than 99% of sampled observations were within the provider cadence plus five seconds over 30 days.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/provider-ecosystem.md

        - alert: OracleProviderErrorObjectiveMiss
          expr: |
            (
              sum by (source, asset) (increase(oracle_provider_fetches_total{outcome=~"error|invalid_payload"}[30d]))
              / clamp_min(sum by (source, asset) (increase(oracle_provider_fetches_total[30d])), 1)
            ) > 0.005
            and on (source, asset)
            sum by (source, asset) (increase(oracle_provider_fetches_total[30d])) >= 100
          for: 15m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Provider error objective missed for {{ $labels.source }} / {{ $labels.asset }}
            description: 'Transport and invalid payload errors exceed 0.5% over 30 days.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/provider-ecosystem.md

        - alert: OracleFeedProviderConcentrationHigh
          expr: |
            oracle_feed_provider_count < 2
            or oracle_feed_provider_hhi > 0.6
            or oracle_feed_max_dependency_share > 0.75
          for: 5m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Provider concentration policy breached for {{ $labels.asset }}
            description: 'Feed diversity is below policy; restore an independent provider or record an approved risk acceptance.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/provider-ecosystem.md

    - name: stellar-oracle.alerts
      interval: 1m
      rules:
        - alert: PriceFeedStale
          expr: |
            time() - oracle_last_price_update_timestamp_seconds > 120
          for: 2m
          labels:
            severity: warning
            component: api
          annotations:
            summary: Price feed stale for {{ $labels.asset }}
            description: 'Last price timestamp for {{ $labels.asset }} is more than 120s old.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-feed-stale.md

        - alert: PriceDeviation
          expr: |
            rate(stellar_oracle_anomalies_detected_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
            component: aggregator
          annotations:
            summary: Price anomaly detected for {{ $labels.asset }}
            description: 'Anomaly detector has flagged {{ $labels.asset }} in the last 5 minutes.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/price-anomaly.md

        - alert: CircuitBreakerOpen
          expr: |
            circuit_breaker_state{state="open"} == 1
          for: 30s
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: Circuit breaker open for {{ $labels.component }}
            description: 'Circuit breaker for {{ $labels.component }} is open; dependent requests are being short-circuited.'
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/circuit-breaker-open.md

        - alert: AggregatorMetricsTargetDown
          expr: |
            up{job=~".*aggregator.*"} == 0
          for: 5m
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: Aggregator metrics scrape target is down
            description: >
              Prometheus cannot scrape the aggregator (up == 0). The process
              serves /health and /metrics on PORT + 2 (4002); verify the
              aggregator Service port http-metrics and the pod listeners.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/aggregator-metrics-missing.md

        - alert: AggregatorMetricsAbsent
          expr: |
            absent(up{job=~".*aggregator.*"})
          for: 10m
          labels:
            severity: critical
            component: aggregator
          annotations:
            summary: No aggregator metrics exist — alerting on it is blind
            description: >
              No scrape series matches job ~ ".*aggregator.*" for 10 minutes,
              so a wrong scrape target (issue #590) looks like healthy silence
              instead of an alert. Expected target: Service port http-metrics
              (4002), path /metrics.
            runbook_url: https://github.com/Stellar-Unified-Price-Oracle/-Stellar-Unified-Price-Oracle-Aggregator-API-Backend/blob/main/docs/runbooks/aggregator-metrics-missing.md
