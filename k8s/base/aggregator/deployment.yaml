# Cell isolation (issue #736):
# Each aggregator Deployment instance belongs to exactly one deployment cell,
# identified by the `cell` label (e.g. cell-a, cell-b). A cell owns a bounded
# set of feeds and their consumers, so a single deployment or dependency
# failure is contained to that cell's feeds only. Other cells keep serving
# their own feeds independently.
#
# Rollout guidance:
#   - Deploy one Deployment per cell (e.g. aggregator-cell-a, aggregator-cell-b)
#     by overriding metadata.name and the `cell` label via kustomize/overlay.
#   - Roll out cells one at a time (canary a single cell first) so a bad release
#     is observed in a bounded blast radius before widening.
#   - Verify per-cell readiness and feed assignment before moving to the next cell.
#
# Rollback guidance:
#   - Roll back only the affected cell's Deployment (kubectl rollout undo) to
#     restore its previous revision without disturbing healthy cells.
#   - Confirm the cell's feeds are reassigned/served after rollback and that
#     CELL_ID matches the cell label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  labels:
    app: aggregator
    version: stable
    cell: cell-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aggregator
      version: stable
      cell: cell-a
  template:
    metadata:
      labels:
        app: aggregator
        version: stable
        cell: cell-a
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: aggregator
                    cell: cell-a
      topologySpreadConstraints:
        # Spread replicas of this cell across nodes and zones independently of
        # other cells, so a node/zone failure only impacts this cell's feeds.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aggregator
              cell: cell-a
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aggregator
              cell: cell-a
      containers:
        - name: aggregator
          image: oracle-aggregator:placeholder
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ws-internal
              containerPort: 4001
            - name: http-health
              containerPort: 4002
          envFrom:
            - configMapRef:
                name: stellar-oracle-config
            - secretRef:
                name: stellar-oracle-secrets
          env:
            - name: PORT
              value: "4000"
            # CELL_ID scopes this pod to its deployment cell. It is sourced from
            # the pod's `cell` label so the runtime feed assignment always matches
            # the scheduling/isolation boundary. A failure here only affects the
            # feeds assigned to this cell.
            - name: CELL_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['cell']
          startupProbe:
            httpGet:
              path: /health/live
              port: http-health
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-health
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
