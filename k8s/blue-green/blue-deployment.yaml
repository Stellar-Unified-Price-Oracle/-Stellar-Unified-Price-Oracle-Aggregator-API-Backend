apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-oracle-api-blue
  namespace: stellar-oracle
  labels:
    app: stellar-oracle-api
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stellar-oracle-api
      slot: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stellar-oracle-api
        slot: blue
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: ghcr.io/stellar-unified-price-oracle/stellar-oracle-api:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: metrics
          env:
            - name: NODE_ENV
              value: production
            - name: DEPLOYMENT_SLOT
              value: blue
          envFrom:
            - secretRef:
                name: stellar-oracle-secrets
            - configMapRef:
                name: stellar-oracle-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
