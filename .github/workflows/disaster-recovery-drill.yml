name: Disaster Recovery Drill
concurrency:
  group: disaster-recovery-drill-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/dr/**'
      - 'k8s/base/timescaledb/**'
      - 'api/src/services/backup.ts'
      - 'api/src/services/dr-status.ts'
      - 'docs/disaster-recovery/**'
      - '.github/workflows/disaster-recovery-drill.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/dr/**'
      - 'k8s/base/timescaledb/**'
      - 'api/src/services/backup.ts'
      - 'api/src/services/dr-status.ts'
      - 'docs/disaster-recovery/**'
      - '.github/workflows/disaster-recovery-drill.yml'
  schedule:
    # 05:00 UTC on the 1st of Jan/Apr/Jul/Oct — quarterly, see docs/disaster-recovery/drills.md
    - cron: '0 5 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      tier:
        description: Recovery tier to drill
        required: false
        type: choice
        default: tier2
        options:
          - tier1
          - tier2
      target_region:
        description: Region to partition during the regional failover scenario
        required: false
        default: us-east-1
      convergence_timeout:
        description: Seconds to wait for CRDT convergence after heal
        required: false
        default: '120'

env:
  DR_TARGET_ENV: staging
  CHAOS_TARGET_ENV: staging

jobs:
  validate-scripts:
    name: Validate DR scripts and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          for f in scripts/dr/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate k8s manifests build
        run: |
          chmod +x scripts/validate-k8s.sh
          ./scripts/validate-k8s.sh

  run-drill:
    name: Run DR drill (${{ github.event.inputs.tier || 'tier2' }})
    needs: validate-scripts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBECONFIG_VALUE: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBECONFIG_VALUE}" > ~/.kube/config

      - name: Run drill
        env:
          API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.STAGING_ADMIN_API_KEY }}
        run: |
          chmod +x scripts/dr/*.sh
          ./scripts/dr/run-drill.sh "${DR_TARGET_ENV}" "${{ github.event.inputs.tier || 'tier2' }}"

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-report
          path: docs/disaster-recovery/reports/*.md

      - name: Commit drill report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/disaster-recovery/reports/
          git diff --cached --quiet || git commit -m "chore: record DR drill report [skip ci]"
          git push

  # Regional failover scenario (consolidated from dr-drill.yml, issue #627).
  dr-drill:
    name: Regional failover DR drill
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Make drill script executable
        run: chmod +x scripts/dr-drill.sh

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run DR drill
        id: drill
        env:
          TARGET_REGION: ${{ github.event.inputs.target_region || 'us-east-1' }}
          CONVERGENCE_TIMEOUT: ${{ github.event.inputs.convergence_timeout || '120' }}
          REPORT_DIR: docs/chaos-engineering/reports
          REGION_US_HEALTH: ${{ vars.REGION_US_HEALTH || 'http://us-east-1.oracle.example/api/v1/health' }}
          REGION_EU_HEALTH: ${{ vars.REGION_EU_HEALTH || 'http://eu-west-1.oracle.example/api/v1/health' }}
          REGION_AP_HEALTH: ${{ vars.REGION_AP_HEALTH || 'http://ap-southeast-1.oracle.example/api/v1/health' }}
          REGION_US_PRICES: ${{ vars.REGION_US_PRICES || 'http://us-east-1.oracle.example/api/v1/prices' }}
          REGION_EU_PRICES: ${{ vars.REGION_EU_PRICES || 'http://eu-west-1.oracle.example/api/v1/prices' }}
          REGION_AP_PRICES: ${{ vars.REGION_AP_PRICES || 'http://ap-southeast-1.oracle.example/api/v1/prices' }}
        run: |
          mkdir -p docs/chaos-engineering/reports
          ./scripts/dr-drill.sh
        continue-on-error: true

      - name: Run 50% regional traffic-loss load test
        id: load_test
        env:
          REGION_US_HEALTH: ${{ vars.REGION_US_HEALTH }}
          REGION_EU_HEALTH: ${{ vars.REGION_EU_HEALTH }}
          REGION_AP_HEALTH: ${{ vars.REGION_AP_HEALTH }}
        run: |
          # GitHub expressions have no string-replace function, so derive the
          # service base URLs from the health endpoints in the shell.
          base_url() {
            if [ -z "${1:-}" ]; then
              echo "http://localhost:3000"
            else
              echo "${1%/api/v1/health}"
            fi
          }
          REGION_URLS="$(base_url "$REGION_US_HEALTH"),$(base_url "$REGION_EU_HEALTH"),$(base_url "$REGION_AP_HEALTH")"
          echo "REGION_URLS=${REGION_URLS}"
          k6 run \
            --env REGION_URLS="${REGION_URLS}" \
            --out json=load-tests/results/dr-drill-traffic-loss.json \
            load-tests/k6/regional-traffic-loss.js
        continue-on-error: true

      - name: Generate drill report
        id: report
        run: |
          REPORT_FILE="docs/chaos-engineering/reports/dr-drill-$(date -u +%Y%m%d-%H%M%S).md"
          mkdir -p docs/chaos-engineering/reports

          DRILL_RESULT="${{ steps.drill.outcome }}"
          LOAD_RESULT="${{ steps.load_test.outcome }}"
          OVERALL="PASS"
          if [[ "$DRILL_RESULT" != "success" || "$LOAD_RESULT" != "success" ]]; then
            OVERALL="FAIL"
          fi

          cat > "$REPORT_FILE" <<EOF
          # DR Drill Report — $(date -u +%Y-%m-%d)

          | Field | Value |
          |-------|-------|
          | Date (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Target Region | ${{ github.event.inputs.target_region || 'us-east-1' }} |
          | Environment | staging |
          | Overall Result | ${OVERALL} |
          | Drill Phase | ${DRILL_RESULT} |
          | Load Test Phase | ${LOAD_RESULT} |
          | Triggered By | ${{ github.event_name }} |
          | Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

          ## Success Criteria

          | Criterion | Status |
          |-----------|--------|
          | Blocked region detected and remaining two regions serve traffic | $( [[ "$DRILL_RESULT" == "success" ]] && echo "✅" || echo "❌") |
          | CRDT convergence verified after heal | $( [[ "$DRILL_RESULT" == "success" ]] && echo "✅" || echo "❌") |
          | 50% traffic-loss load scenario within thresholds | $( [[ "$LOAD_RESULT" == "success" ]] && echo "✅" || echo "❌") |

          ## Artifacts

          - Drill log: see workflow run linked above
          - Load test results: \`load-tests/results/dr-drill-traffic-loss.json\`
          EOF

          echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
          echo "overall=${OVERALL}" >> "$GITHUB_OUTPUT"
          cat "$REPORT_FILE"

      - name: Upload drill report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr-drill-report-${{ github.run_number }}
          path: |
            docs/chaos-engineering/reports/
            load-tests/results/dr-drill-traffic-loss.json

      - name: Fail workflow if drill did not pass
        if: steps.report.outputs.overall == 'FAIL'
        run: |
          echo "DR drill failed — see report artifact for details"
          exit 1

      - name: Record drill outcome
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          DRILL_STATUS: ${{ job.status }}
          DRILL_RESULT: ${{ steps.report.outputs.overall }}
        with:
          script: |
            const status = process.env.DRILL_STATUS;
            const body = [
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Status: ${status}`,
              `Drill result: ${process.env.DRILL_RESULT || 'n/a'}`,
              'RTO/RPO: record the achieved values from the drill report artifact.',
              '',
              'Outcome is durable here and in the dr-drill-report artifact.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[drill] regional failover ${new Date().toISOString().slice(0, 10)}: ${status}`,
              body,
              labels: ['drill-outcome', 'operations'],
            });
