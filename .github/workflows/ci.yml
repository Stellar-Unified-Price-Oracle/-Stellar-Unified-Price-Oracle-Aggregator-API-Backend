name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  cost-optimization:
    name: Cost model and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify cost analysis report
        run: npm run cost:check

  price-correctness:
    name: Price correctness validation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate aggregated price correctness
        run: npm run validate:prices

  aggregator:
    name: Aggregator service build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/aggregator
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  api:
    name: API service build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  contract-verification:
    name: Contract formal verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cargo tests and property checks
        run: cargo test
        working-directory: contracts/price-oracle

      - name: Upgrade state-migration test (issue #381)
        run: cargo test upgrade_migration --verbose
        working-directory: contracts/price-oracle

      - name: Generate verification report
        run: node scripts/generate-verification-report.mjs

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: price-oracle-verification-report
          path: verification/reports/latest.md
          retention-days: 30

      - name: Post verification report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('verification/reports/latest.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  kustomize-validate:
    name: Kustomize overlay validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize /usr/local/bin/

      - name: Validate dev overlay
        run: kustomize build k8s/overlays/dev

      - name: Validate staging overlay
        run: kustomize build k8s/overlays/staging

      - name: Validate prod overlay
        run: kustomize build k8s/overlays/prod

      - name: Validate prod-us-east-1 overlay
        run: kustomize build k8s/overlays/prod-us-east-1

      - name: Validate prod-eu-west-1 overlay
        run: kustomize build k8s/overlays/prod-eu-west-1

      - name: Validate prod-ap-southeast-1 overlay
        run: kustomize build k8s/overlays/prod-ap-southeast-1

  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start API server in background
        run: node dist/index.js &
        env:
          PORT: 3000
          DATABASE_URL: postgresql://oracle:oracle@localhost:5432/oracle_test
          NODE_ENV: test

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/v1/health && break
            echo "Waiting for server... ($i/20)"
            sleep 2
          done

      - name: Run performance benchmark
        run: node ../scripts/benchmark.js
        env:
          BENCHMARK_BASE_URL: http://localhost:3000
          BENCHMARK_THRESHOLD_PCT: '20'
          BENCHMARK_ITERATIONS: '20'
          # Sequential-request throughput floor (see scripts/benchmark.js)
          BENCHMARK_TARGET_TPS: '100'

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: scripts/benchmark-baseline.json
          retention-days: 30

  # The REST and WebSocket surface is otherwise only exercised by unit tests, so
  # this job runs the real pipeline offline: a stub stands in for the four
  # upstream oracle APIs, the aggregator polls it and broadcasts, and the API
  # serves the history files the aggregator writes. No database is needed — both
  # services fall back to file-backed storage — and nothing here touches the
  # network.
  api-integration:
    name: API integration tests (live stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build services
        run: npm run build:backend

      - name: Run integration tests against a live stack
        env:
          # The stub is reached over loopback, which the SSRF guard blocks by
          # default, and the test clients connect without an Origin header.
          SSRF_ALLOW_PRIVATE_IPS: 'true'
          WS_REQUIRE_ORIGIN: 'false'
        run: |
          set -euo pipefail

          nohup node scripts/stub-oracle-server.mjs > /tmp/stub-oracle.log 2>&1 &

          # Each service resolves its history directory relative to its own dist
          # folder, so they only agree when api/data points at the aggregator's.
          rm -rf api/data
          ln -s "$PWD/services/aggregator/data" api/data

          (
            cd services/aggregator
            nohup env \
              PORT=4000 \
              POLLING_INTERVAL_MS=5000 \
              WATCHED_ASSETS=XLM,USDC,BTC,ETH,USDT \
              CHAINLINK_BASE_URL=http://localhost:4010 \
              REDSTONE_BASE_URL=http://localhost:4010 \
              BAND_BASE_URL=http://localhost:4010 \
              REFLECTOR_BASE_URL=http://localhost:4010 \
              node dist/index.js > /tmp/aggregator.log 2>&1 &
          )

          (
            cd api
            nohup env \
              API_PORT=3000 \
              WS_PORT=3001 \
              API_KEYS='test-key:10000:ci-integration:pro:viewer' \
              node dist/index.js > /tmp/api.log 2>&1 &
          )

          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4002/health > /dev/null \
              && curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "Stack ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Stack did not become ready"
            echo '--- stub oracle ---'; tail -20 /tmp/stub-oracle.log || true
            echo '--- aggregator ---'; tail -60 /tmp/aggregator.log || true
            echo '--- api ---'; tail -60 /tmp/api.log || true
            exit 1
          fi

          # Let the aggregator finish a poll cycle so prices exist and the
          # socket has broadcast at least once before the WS test subscribes.
          sleep 8

          cd api
          RUN_INTEGRATION_TESTS=1 TEST_API_KEY=test-key \
            npx vitest run \
              tests/integration.test.ts \
              tests/v2-assets.test.ts \
              tests/v2-batch-prices.test.ts

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo '--- stub oracle ---'; tail -40 /tmp/stub-oracle.log 2>/dev/null || true
          echo '--- aggregator ---'; tail -80 /tmp/aggregator.log 2>/dev/null || true
          echo '--- api ---'; tail -80 /tmp/api.log 2>/dev/null || true
