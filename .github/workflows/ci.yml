name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Longer fuzz run: nightly at 03:00 UTC.
    - cron: '0 3 * * *'

env:
  NODE_VERSION: '20'
  # Pinned nightly toolchain so fuzz runs are reproducible locally and in CI.
  FUZZ_NIGHTLY: 'nightly-2024-06-01'

jobs:
  cost-optimization:
    name: Cost model and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify cost analysis report
        run: npm run cost:check

  price-correctness:
    name: Price correctness validation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate aggregated price correctness
        run: npm run validate:prices

  config-contracts:
    name: Configuration contract tests (env vars, ports, routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Env-var contract — code reads vs .env.example
        # Fails with actionable MISSING_DOC / UNUSED_DOC lines naming the
        # variable and the file to update.  See scripts/check-env-contract.mjs.
        run: node scripts/check-env-contract.mjs

      - name: Route contract — Express mounts vs OpenAPI spec
        # Fails with MOUNT_UNDOCUMENTED / OPENAPI_UNMOUNTED lines.
        # See scripts/check-route-contract.mjs.
        run: node scripts/check-route-contract.mjs

      - name: Port contract — compose/k8s/docs vs real listeners
        # Pre-existing check (issue #590); kept here for grouping clarity.
        run: node scripts/check-port-consistency.mjs

  aggregator:
    name: Aggregator service build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/aggregator
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  api:
    name: API service build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  contract-verification:
    name: Contract formal verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (TLC)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned verification tools
        run: node scripts/install-verification-tools.mjs

      - name: Cargo tests and property checks
        id: cargo_test
        run: cargo test
        working-directory: contracts/price-oracle

      - name: Upgrade state-migration test (issue #381)
        run: cargo test upgrade_migration --verbose
        working-directory: contracts/price-oracle

      - name: Generate verification report
        if: always()
        env:
          CARGO_TEST_OUTCOME: ${{ steps.cargo_test.outcome }}
        run: node scripts/generate-verification-report.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-oracle-verification-report
          path: verification/reports/
          retention-days: 30

      - name: Post verification report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'verification/reports/latest.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # cargo-fuzz targets in contracts/price-oracle/fuzz. The committed corpus in
  # fuzz/corpus/<target>/ is the seed set; any input the fuzzer finds is added
  # back as a regression seed. A crash fails this job (no continue-on-error) and
  # the crashing input is uploaded as an artifact for triage.
  #
  # Targets and the invariants they assert (see fuzz/README.md):
  #   fuzz_get_price    - get_price never panics and always returns a valid
  #                       (non-negative) price for any asset name / decimals.
  #   fuzz_submit_price - submit_price rejects unauthorized callers and
  #                       out-of-range prices without panicking.
  #
  # This is the dynamic layer only; the deterministic SMT/TLA checks live in the
  # contract-verification job above and are not a substitute for fuzzing.
  fuzz:
    name: cargo-fuzz (${{ github.event_name == 'schedule' && 'scheduled' || 'smoke' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/price-oracle
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz targets
        env:
          # Short bounded smoke run on PRs; longer budget on the nightly schedule.
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '30' }}
        run: |
          set -euo pipefail
          for target in fuzz_get_price fuzz_submit_price; do
            echo "::group::fuzz $target (${FUZZ_SECONDS}s)"
            cargo fuzz run "$target" -- -max_total_time="$FUZZ_SECONDS"
            echo "::endgroup::"
          done

      - name: Report corpus/coverage signals
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## cargo-fuzz coverage signals"
            echo ""
            echo "| target | corpus files | corpus bytes |"
            echo "| --- | --- | --- |"
            for target in fuzz_get_price fuzz_submit_price; do
              dir="fuzz/corpus/$target"
              files=$(find "$dir" -type f 2>/dev/null | wc -l | tr -d ' ')
              bytes=$(du -sb "$dir" 2>/dev/null | cut -f1 || echo 0)
              echo "| $target | $files | $bytes |"
            done
            echo ""
            echo "A target whose corpus never grows is exploring nothing; check the"
            echo "harness and the committed seeds. exec/s and edges are printed by"
            echo "cargo fuzz run above."
          } | tee fuzz-coverage-report.md

      - name: Upload fuzz coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage-report
          path: contracts/price-oracle/fuzz-coverage-report.md
          retention-days: 30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: |
            contracts/price-oracle/fuzz/artifacts/**
            contracts/price-oracle/fuzz/corpus/**
          retention-days: 30

  kustomize-validate:
    name: Kustomize overlay validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check aggregator port consistency (issue #590)
        run: node scripts/check-port-consistency.mjs

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize /usr/local/bin/

      - name: Validate dev overlay
        run: kustomize build k8s/overlays/dev

      - name: Validate staging overlay
        run: kustomize build k8s/overlays/staging

      - name: Validate prod overlay
        run: kustomize build k8s/overlays/prod

      - name: Validate prod-us-east-1 overlay
        run: kustomize build k8s/overlays/prod-us-east-1

      - name: Validate prod-eu-west-1 overlay
        run: kustomize build k8s/overlays/prod-eu-west-1

      - name: Validate prod-ap-southeast-1 overlay
        run: kustomize build k8s/overlays/prod-ap-southeast-1

  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start API server in background
        run: node dist/index.js &
        env:
          PORT: 3000
          DATABASE_URL: postgresql://oracle:oracle@localhost:5432/oracle_test
          NODE_ENV: test

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/v1/health && break
            echo "Waiting for server... ($i/20)"
            sleep 2
          done

      - name: Run performance benchmark
        run: node ../scripts/benchmark.js
        env:
          BENCHMARK_BASE_URL: http://localhost:3000
          BENCHMARK_THRESHOLD_PCT: '20'
          BENCHMARK_ITERATIONS: '20'
          # Sequential-request throughput floor (see scripts/benchmark.js)
          BENCHMARK_TARGET_TPS: '100'

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: scripts/benchmark-baseline.json
          retention-days: 30

  # The REST and WebSocket surface is otherwise only exercised by unit tests, so
  # this job runs the real pipeline offline: a stub stands in for the four
  # upstream oracle APIs, the aggregator polls it and broadcasts, and the API
  # serves the history files the aggregator writes. No database is needed — both
  # services fall back to file-backed storage — and nothing here touches the
  # network.
  api-integration:
    name: API integration tests (live stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (build + stack + tests + teardown)
        # SSRF guard blocks loopback by default; the stub runs on loopback.
        # WS clients in tests connect without an Origin header.
        # SKIP_BUILD is not set so the script builds first, matching the local
        # developer experience exactly (same entry point, same behaviour).
        env:
          SSRF_ALLOW_PRIVATE_IPS: 'true'
          WS_REQUIRE_ORIGIN: 'false'
          TEST_API_KEY: 'integration-ci-key'
        run: npm run test:integration
