name: History gap detection
concurrency:
  group: history-gap-detection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #421 — keep the price_history dataset continuous and complete.
# Runs hourly and on demand. A gap over the threshold (detector exit 1) opens an
# alert issue; install or connection failures fail the job without one.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to scan from (default: last 7 days)'
        required: false

env:
  NODE_VERSION: '22'
  HISTORY_EXPECTED_INTERVAL_SEC: '60'
  HISTORY_GAP_ALERT_SEC: '900'

jobs:
  detect-gaps:
    name: Detect price_history gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The threshold-breach step opens a tracking issue; a clean run closes it.
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check HISTORY_DATABASE_URL is configured
        id: guard
        env:
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          if [ -z "$HISTORY_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HISTORY_DATABASE_URL is not set — skipping gap detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Exit codes: 0 = clean, 1 = gap over threshold, 2 = usage/connection error.
      # The report is read from --output, never from stdout, so npm/tsx noise
      # cannot corrupt it.
      - name: Detect gaps
        id: detect
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set +e
          report="$RUNNER_TEMP/gaps.json"
          rm -f "$report"
          if [ -n "$SINCE" ]; then
            npm run --silent history:gaps -- --output "$report" --since "$SINCE"
          else
            npm run --silent history:gaps -- --output "$report"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::Gap detector could not run (exit $code); this is not a gap result."
          fi
          exit $code

      # Only a detector exit 1 backed by a readable report listing at least one
      # gap over the threshold may open or update an alert. Install, guard or
      # connection failures fail the job without claiming a gap.
      - name: Alert on threshold breach
        if: failure() && steps.detect.outputs.exit_code == '1'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.detect.outputs.report }}
        with:
          script: |
            const fs = require('fs');
            const { parseGapReport, gapAlertStatus, renderGapAlertBody, syncGapAlert } =
              await import(`${process.env.GITHUB_WORKSPACE}/scripts/history-gap-alert.mjs`);
            let report = null;
            try {
              report = parseGapReport(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            } catch (err) {
              core.error(`Could not read detector report: ${err.message}`);
            }
            const status = gapAlertStatus('${{ steps.detect.outputs.exit_code }}', report);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = renderGapAlertBody(report, { runUrl });
            const result = await syncGapAlert(github, { ...context.repo, status, body, runUrl });
            core.info(`Gap alert: ${JSON.stringify(result)}`);

      # A clean scan (detector exit 0) closes every open gap alert, so false or
      # already-backfilled alerts do not linger after the history is complete.
      - name: Close resolved gap alerts
        if: success() && steps.detect.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { syncGapAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/history-gap-alert.mjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const result = await syncGapAlert(github, { ...context.repo, status: 'clean', runUrl });
            core.info(`Closed gap alerts: ${JSON.stringify(result.issues)}`);
