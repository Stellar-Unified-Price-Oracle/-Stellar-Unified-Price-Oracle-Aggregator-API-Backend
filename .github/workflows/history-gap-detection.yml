name: History gap detection
concurrency:
  group: history-gap-detection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #421 — keep the price_history dataset continuous and complete.
# Runs hourly and on demand; fails (alerts) when a gap exceeds the threshold.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to scan from (default: last 7 days)'
        required: false

env:
  NODE_VERSION: '20'
  HISTORY_EXPECTED_INTERVAL_SEC: '60'
  HISTORY_GAP_ALERT_SEC: '900'

jobs:
  detect-gaps:
    name: Detect price_history gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The threshold-breach step opens a tracking issue.
      issues: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check HISTORY_DATABASE_URL is configured
        id: guard
        env:
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          if [ -z "$HISTORY_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HISTORY_DATABASE_URL is not set — skipping gap detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect gaps
        id: detect
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set +e
          npm run history:gaps -- --json --output "$RUNNER_TEMP/history-gaps.json" ${SINCE:+--since "$SINCE"}
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error::Gap detector could not run (usage or database error); no gap was evaluated."
          fi
          exit "$code"

      # Only exit code 1 means a gap exceeded the threshold. Install failures,
      # database outages and usage errors (exit 2) fail the job without filing a
      # misleading "gap detected" issue. Repeated breaches update the single open
      # alert issue instead of opening one per hourly run.
      - name: Alert on threshold breach
        if: failure() && steps.detect.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { renderGapAlertBody, syncGapAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/history-gap-alert.mjs`);
            const summaryPath = `${process.env.RUNNER_TEMP}/history-gaps.json`;
            const summary = fs.existsSync(summaryPath) ? JSON.parse(fs.readFileSync(summaryPath, 'utf8')) : null;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const result = await syncGapAlert(github, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'gap',
              runUrl,
              body: renderGapAlertBody(summary, { runUrl, threshold: process.env.HISTORY_GAP_ALERT_SEC }),
            });
            core.info(`Gap alert ${result.action} #${result.issue}`);

      - name: Close resolved gap alerts
        if: success() && steps.detect.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { syncGapAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/history-gap-alert.mjs`);
            const result = await syncGapAlert(github, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'clean',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`Closed gap alerts: ${result.issues.join(', ') || 'none'}`);
