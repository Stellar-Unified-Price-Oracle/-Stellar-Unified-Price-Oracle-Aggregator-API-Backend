name: History gap detection
concurrency:
  group: history-gap-detection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #421 — keep the price_history dataset continuous and complete.
# Runs hourly and on demand. A gap over the threshold (detector exit 1) opens an
# alert issue; install or connection failures fail the job without one.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to scan from (default: last 7 days)'
        required: false

env:
  NODE_VERSION: '20'
  HISTORY_EXPECTED_INTERVAL_SEC: '60'
  HISTORY_GAP_ALERT_SEC: '900'

jobs:
  detect-gaps:
    name: Detect price_history gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The threshold-breach step opens a tracking issue.
      issues: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check HISTORY_DATABASE_URL is configured
        id: guard
        env:
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          if [ -z "$HISTORY_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HISTORY_DATABASE_URL is not set — skipping gap detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect gaps
        id: detect
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set +e
          npm run --silent history:gaps -- --json ${SINCE:+--since "$SINCE"} > gap-report.json
          code=$?
          set -e
          cat gap-report.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Alert on threshold breach
        if: steps.detect.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `price_history gap detected (${new Date().toISOString().slice(0, 10)})`,
              labels: ['data', 'alert'],
              body: [
                'The scheduled history gap detector found a gap exceeding',
                `\`HISTORY_GAP_ALERT_SEC=${process.env.HISTORY_GAP_ALERT_SEC}\`.`,
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Backfill with `npm run history:backfill -- --asset <ASSET> --from <startTs> --to <endTs>`',
                'then re-run this workflow to confirm the gap is closed.',
              ].join('\n'),
            });

      - name: Fail on gap or detector error
        if: steps.detect.outputs.exit_code != '' && steps.detect.outputs.exit_code != '0'
        run: |
          if [ "${{ steps.detect.outputs.exit_code }}" = "1" ]; then
            echo "::error::A price_history gap exceeded HISTORY_GAP_ALERT_SEC=${HISTORY_GAP_ALERT_SEC}."
          else
            echo "::error::Gap detector could not complete (exit ${{ steps.detect.outputs.exit_code }}); no gap was measured."
          fi
          exit 1
