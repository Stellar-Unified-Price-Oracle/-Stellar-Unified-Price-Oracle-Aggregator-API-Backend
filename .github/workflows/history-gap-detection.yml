name: History gap detection
concurrency:
  group: history-gap-detection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #421 — keep the price_history dataset continuous and complete.
# Runs hourly and on demand; fails (alerts) when a gap exceeds the threshold.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to scan from (default: last 7 days)'
        required: false

env:
  NODE_VERSION: '20'
  HISTORY_EXPECTED_INTERVAL_SEC: '60'
  HISTORY_GAP_ALERT_SEC: '900'

jobs:
  detect-gaps:
    name: Detect price_history gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The threshold-breach step opens a tracking issue.
      issues: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check HISTORY_DATABASE_URL is configured
        id: guard
        env:
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          if [ -z "$HISTORY_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HISTORY_DATABASE_URL is not set — skipping gap detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect gaps
        id: detect
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          # Exit codes from detect-history-gaps.ts: 0 = no gap over threshold,
          # 1 = gap over threshold, 2 = usage/connection error. Only 1 is a gap.
          set +e
          if [ -n "$SINCE" ]; then
            npm run --silent history:gaps -- --json --since "$SINCE" > "$RUNNER_TEMP/gaps.json"
          else
            npm run --silent history:gaps -- --json > "$RUNNER_TEMP/gaps.json"
          fi
          code=$?
          set -e
          cat "$RUNNER_TEMP/gaps.json"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "gap_found=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "gap_found=true" >> "$GITHUB_OUTPUT"
               echo "::error::price_history gap exceeds HISTORY_GAP_ALERT_SEC=${HISTORY_GAP_ALERT_SEC}s" ;;
            *) echo "gap_found=false" >> "$GITHUB_OUTPUT"
               echo "::error::Gap detector could not run (exit $code); this is not a gap result." ;;
          esac
          exit "$code"

      # Only a confirmed gap (detector exit 1) opens or updates an alert issue.
      # Setup or connection failures fail the job without claiming a gap.
      - name: Alert on threshold breach
        if: always() && steps.detect.outputs.gap_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/gaps.json`, 'utf8'));
            const threshold = Number(report.alertThreshold);
            const alerting = report.gaps.filter((g) => g.gapSeconds === null || g.gapSeconds > threshold);
            const iso = (ts) => (ts ? new Date(ts * 1000).toISOString() : 'n/a');
            const rows = alerting.slice(0, 25).map((g) =>
              g.gapSeconds === null
                ? `| ${g.asset} | no rows in window | | | |`
                : `| ${g.asset} | ${iso(g.startTs)} | ${iso(g.endTs)} | ${g.gapSeconds} | \`npm run history:backfill -- --asset ${g.asset} --from ${g.startTs} --to ${g.endTs}\` |`,
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const details = [
              `Run: ${runUrl}`,
              `Window start: ${report.windowStart} · scanned ${report.scannedRows} rows across ${report.scannedAssets} assets`,
              `${alerting.length} gap(s) exceed \`HISTORY_GAP_ALERT_SEC=${threshold}\`:`,
              '',
              '| Asset | From | To | Gap (s) | Backfill |',
              '|---|---|---|---|---|',
              ...rows,
              alerting.length > rows.length ? `\n…and ${alerting.length - rows.length} more; see the run log.` : '',
            ].join('\n');

            const titlePrefix = 'price_history gap detected';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'alert',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title.startsWith(titlePrefix));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Gap still present.\n\n${details}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} (${new Date().toISOString().slice(0, 10)})`,
              labels: ['data', 'alert'],
              body: [
                'The scheduled history gap detector found a gap exceeding',
                `\`HISTORY_GAP_ALERT_SEC=${threshold}\`.`,
                '',
                details,
                '',
                'Run the backfill commands above, then re-run this workflow to confirm the gap is closed.',
              ].join('\n'),
            });
