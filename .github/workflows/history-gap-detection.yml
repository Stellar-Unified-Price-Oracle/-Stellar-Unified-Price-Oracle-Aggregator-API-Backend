name: History gap detection
concurrency:
  group: history-gap-detection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #421 — keep the price_history dataset continuous and complete.
# Runs hourly and on demand. A gap over the threshold (detector exit 1) opens an
# alert issue; install or connection failures fail the job without one.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to scan from (default: last 7 days)'
        required: false

env:
  NODE_VERSION: '22'
  HISTORY_EXPECTED_INTERVAL_SEC: '60'
  HISTORY_GAP_ALERT_SEC: '900'

jobs:
  detect-gaps:
    name: Detect price_history gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The threshold-breach step opens a tracking issue.
      issues: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check HISTORY_DATABASE_URL is configured
        id: guard
        env:
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          if [ -z "$HISTORY_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HISTORY_DATABASE_URL is not set — skipping gap detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Exit codes: 0 = clean, 1 = gap over threshold, 2 = usage/connection error.
      # Only exit 1 is a data gap; anything else must not file a gap alert.
      - name: Detect gaps
        id: detect
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          set +e
          npm run --silent history:gaps -- --output "$RUNNER_TEMP/gaps.json" ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}
          code=$?
          cat "$RUNNER_TEMP/gaps.json"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Only exit code 1 means a gap exceeded the threshold. Install, guard or
      # connection failures (exit 2) fail the job without opening a gap issue.
      - name: Alert on threshold breach
        if: failure() && steps.detect.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const threshold = Number(process.env.HISTORY_GAP_ALERT_SEC);
            let report = null;
            try {
              report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/gaps.json`, 'utf8'));
            } catch (err) {
              core.warning(`Could not parse detector output: ${err.message}`);
            }
            const iso = (ts) => new Date(ts * 1000).toISOString();
            const alerting = (report?.gaps ?? []).filter((g) => g.gapSeconds === null || g.gapSeconds > threshold);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const lines = [
              'The scheduled history gap detector found a gap exceeding',
              `\`HISTORY_GAP_ALERT_SEC=${threshold}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
            ];
            if (alerting.length > 0) {
              lines.push(
                `Scanned ${report.scannedRows} rows across ${report.scannedAssets} assets since ${report.windowStart}.`,
                '',
                '| Asset | From | To | Gap (s) | Missing snapshots |',
                '| --- | --- | --- | --- | --- |',
                ...alerting.slice(0, 50).map((g) =>
                  g.gapSeconds === null
                    ? `| ${g.asset} | — | — | no rows in window | — |`
                    : `| ${g.asset} | ${iso(g.startTs)} | ${iso(g.endTs)} | ${g.gapSeconds} | ${g.missingSnapshots} |`),
                '',
                'Backfill from `api/`:',
                '',
                '```sh',
                ...alerting
                  .filter((g) => g.gapSeconds !== null)
                  .slice(0, 50)
                  .map((g) => `npm run history:backfill -- --asset ${g.asset} --from ${g.startTs} --to ${g.endTs}`),
                '```',
              );
              if (alerting.length > 50) lines.push('', `…and ${alerting.length - 50} more; see the run log.`);
            } else {
              lines.push('Backfill with `npm run history:backfill -- --asset <ASSET> --from <startTs> --to <endTs>`');
            }
            lines.push('', 'then re-run this workflow to confirm the gap is closed.');

            const body = lines.join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data,alert',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title.startsWith('price_history gap detected'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Gap still open; commented on #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `price_history gap detected (${new Date().toISOString().slice(0, 10)})`,
                labels: ['data', 'alert'],
                body,
              });
            }
