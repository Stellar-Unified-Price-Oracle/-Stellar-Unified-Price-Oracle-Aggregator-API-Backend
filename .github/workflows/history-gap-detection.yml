name: History gap detection
concurrency:
  group: history-gap-detection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #421 — keep the price_history dataset continuous and complete.
# Runs hourly and on demand; fails when a gap exceeds the threshold. Only a
# real threshold breach opens an alert issue; install or connection failures
# just fail the run.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to scan from (default: last 7 days)'
        required: false

env:
  NODE_VERSION: '20'
  HISTORY_EXPECTED_INTERVAL_SEC: '60'
  HISTORY_GAP_ALERT_SEC: '900'

jobs:
  detect-gaps:
    name: Detect price_history gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The threshold-breach step opens a tracking issue.
      issues: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check HISTORY_DATABASE_URL is configured
        id: guard
        env:
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          if [ -z "$HISTORY_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HISTORY_DATABASE_URL is not set — skipping gap detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Exit codes from detect-history-gaps.ts: 0 = clean, 1 = a gap exceeded
      # HISTORY_GAP_ALERT_SEC, 2 = usage/connection error. Only 1 is a data
      # gap; anything else is a pipeline failure and must not be reported as one.
      - name: Detect gaps
        id: detect
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set +e
          npx tsx scripts/detect-history-gaps.ts --json ${SINCE:+--since "$SINCE"} > gaps.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat gaps.json
          exit "$code"

      - name: Alert on threshold breach
        if: failure() && steps.detect.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const threshold = Number(process.env.HISTORY_GAP_ALERT_SEC);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let report = null;
            try {
              report = JSON.parse(fs.readFileSync('api/gaps.json', 'utf8'));
            } catch (err) {
              core.warning(`Could not parse api/gaps.json: ${err.message}`);
            }

            const iso = (ts) => new Date(ts * 1000).toISOString();
            const alerting = (report?.gaps ?? []).filter(
              (g) => g.gapSeconds === null || g.gapSeconds > threshold,
            );
            const shown = alerting.slice(0, 25);
            const table = shown.length
              ? [
                  '| Asset | From | To | Gap (s) | Backfill |',
                  '|---|---|---|---|---|',
                  ...shown.map((g) =>
                    `| ${g.asset} | ${iso(g.startTs)} | ${iso(g.endTs)} | ${g.gapSeconds ?? 'no data'} | ` +
                    `\`npm run history:backfill -- --asset ${g.asset} --from ${g.startTs} --to ${g.endTs}\` |`,
                  ),
                  ...(alerting.length > shown.length
                    ? ['', `_${alerting.length - shown.length} more gap(s) omitted; see the run log._`]
                    : []),
                ].join('\n')
              : '_Gap details were not captured; see the run log._';

            const details = [
              `Run: ${runUrl}`,
              ...(report
                ? [`Window: since ${report.windowStart} (${report.scannedRows} rows, ${report.scannedAssets} assets)`]
                : []),
              '',
              table,
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data,alert',
              per_page: 100,
            });
            const existing = open.find(
              (i) => !i.pull_request && i.title.startsWith('price_history gap detected'),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: ['Gap still present on the latest scheduled run.', '', details].join('\n'),
              });
              core.notice(`Updated existing alert #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `price_history gap detected (${new Date().toISOString().slice(0, 10)})`,
              labels: ['data', 'alert'],
              body: [
                'The scheduled history gap detector found a gap exceeding',
                `\`HISTORY_GAP_ALERT_SEC=${threshold}\`.`,
                '',
                details,
                '',
                'Run the backfill command for each row, then re-run this workflow to',
                'confirm the gap is closed. Later runs comment here instead of opening',
                'new issues until this one is closed.',
              ].join('\n'),
            });
