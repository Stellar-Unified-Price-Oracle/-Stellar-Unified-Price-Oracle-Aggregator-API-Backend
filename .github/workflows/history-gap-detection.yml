name: History gap detection
concurrency:
  group: history-gap-detection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #421 — keep the price_history dataset continuous and complete.
# Runs hourly and on demand; fails (alerts) when a gap exceeds the threshold.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to scan from (default: last 7 days)'
        required: false

env:
  NODE_VERSION: '20'
  HISTORY_EXPECTED_INTERVAL_SEC: '60'
  HISTORY_GAP_ALERT_SEC: '900'

jobs:
  detect-gaps:
    name: Detect price_history gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The threshold-breach step opens a tracking issue.
      issues: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check HISTORY_DATABASE_URL is configured
        id: guard
        env:
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          if [ -z "$HISTORY_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HISTORY_DATABASE_URL is not set — skipping gap detection."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect gaps
        id: detect
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set +e
          npm run --silent history:gaps -- --json ${SINCE:+--since "$SINCE"} > gaps.json
          code=$?
          set -e
          cat gaps.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error::Gap detector could not run (usage or connection error)."
          fi
          exit "$code"

      # Only exit code 1 means a gap exceeded the threshold. Install, setup or
      # connection failures (exit 2) fail the job without opening a gap alert.
      - name: Alert on threshold breach
        if: failure() && steps.detect.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const threshold = Number(process.env.HISTORY_GAP_ALERT_SEC);
            let alerting = [];
            try {
              const summary = JSON.parse(fs.readFileSync('api/gaps.json', 'utf8'));
              alerting = (summary.gaps || []).filter((g) => g.gapSeconds > threshold);
            } catch (err) {
              core.warning(`Could not parse detector output: ${err.message}`);
            }
            const iso = (ts) => new Date(ts * 1000).toISOString();
            const shown = alerting.slice(0, 25);
            const table = shown.length
              ? [
                  '| Asset | From | To | Gap (s) | Backfill |',
                  '| --- | --- | --- | --- | --- |',
                  ...shown.map((g) =>
                    `| ${g.asset} | ${iso(g.startTs)} | ${iso(g.endTs)} | ${g.gapSeconds} | ` +
                    `\`npm run history:backfill -- --asset ${g.asset} --from ${g.startTs} --to ${g.endTs}\` |`),
                  ...(alerting.length > shown.length
                    ? ['', `…and ${alerting.length - shown.length} more; see the run log.`]
                    : []),
                ]
              : ['Gap details unavailable; see the run log.'];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `price_history gap detected (${new Date().toISOString().slice(0, 10)})`,
              labels: ['data', 'alert'],
              body: [
                `The scheduled history gap detector found ${alerting.length || 'a'} gap(s) exceeding`,
                `\`HISTORY_GAP_ALERT_SEC=${threshold}\`.`,
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                ...table,
                '',
                'Run each backfill command from `api/`, then re-run this workflow to confirm the gap is closed.',
              ].join('\n'),
            });
