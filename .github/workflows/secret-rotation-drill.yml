name: Quarterly Secret Rotation Drill
concurrency:
  group: secret-rotation-drill-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  schedule:
    # 09:00 UTC on the 1st of Jan/Apr/Jul/Oct — quarterly drill cadence.
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  drill:
    name: Dry-run rotation for every secret category
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run rotation drill (dry-run)
        run: |
          mkdir -p drill-results
          for category in encryption-key api-keys ws-secrets db-credentials signer-key; do
            echo "== $category ==" | tee -a drill-results/summary.txt
            bash scripts/rotate-secrets.sh "$category" --dry-run | tee -a drill-results/summary.txt
          done
          echo "Drill completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a drill-results/summary.txt

      - name: Upload drill results
        uses: actions/upload-artifact@v4
        with:
          name: secret-rotation-drill-${{ github.run_id }}
          path: drill-results/summary.txt
          retention-days: 400

  record-outcome:
    name: Record drill outcome
    if: always() && github.event_name == 'schedule'
    needs: [drill]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DRILL_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        with:
          script: |
            const status = process.env.DRILL_STATUS;
            const body = [
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Status: ${status}`,
              'Record the achieved RTO/RPO in docs/operations/DRILL_LOG.md.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[drill] secret-rotation-drill ${new Date().toISOString().slice(0, 10)}: ${status}`,
              body,
              labels: ['drill-outcome', 'operations'],
            });
