name: Terraform Multi-Region

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"

env:
  TF_VERSION: "1.9.0"

# Prevent concurrent runs on the same ref to avoid state corruption
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Validate ───────────────────────────────────────────────────────────────
  validate:
    name: Validate (${{ matrix.region }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:
          - us-east-1
          - eu-west-1
          - ap-southeast-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (${{ matrix.region }})
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ matrix.region }}

      - name: Terraform fmt check
        working-directory: infrastructure/terraform/environments/${{ matrix.region }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/${{ matrix.region }}
        run: |
          terraform init \
            -backend=false \
            -input=false

      - name: Terraform validate
        working-directory: infrastructure/terraform/environments/${{ matrix.region }}
        run: terraform validate

  # ── Plan ──────────────────────────────────────────────────────────────────
  plan:
    name: Plan (${{ matrix.region }})
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    strategy:
      fail-fast: false
      matrix:
        region:
          - us-east-1
          - eu-west-1
          - ap-southeast-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (${{ matrix.region }})
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ matrix.region }}

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/${{ matrix.region }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.region }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        id: plan
        working-directory: infrastructure/terraform/environments/${{ matrix.region }}
        env:
          TF_VAR_db_password:       ${{ secrets.DB_PASSWORD }}
          TF_VAR_api_image:         ${{ secrets.API_IMAGE }}
          TF_VAR_aggregator_image:  ${{ secrets.AGGREGATOR_IMAGE }}
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -input=false \
            -out=tfplan-${{ matrix.region }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.region }}
          path: infrastructure/terraform/environments/${{ matrix.region }}/tfplan-${{ matrix.region }}
          retention-days: 1

  # ── Apply ─────────────────────────────────────────────────────────────────
  apply:
    name: Apply (${{ matrix.region }})
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region:
          - us-east-1
          - eu-west-1
          - ap-southeast-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (${{ matrix.region }})
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ matrix.region }}

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/${{ matrix.region }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.region }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.region }}
          path: infrastructure/terraform/environments/${{ matrix.region }}

      - name: Terraform apply
        working-directory: infrastructure/terraform/environments/${{ matrix.region }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan-${{ matrix.region }}
