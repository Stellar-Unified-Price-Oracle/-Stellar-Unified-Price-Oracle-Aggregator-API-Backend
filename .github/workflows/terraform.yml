name: Terraform
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to plan/apply'
        required: true
        default: 'us-east-1'
        type: choice
        options:
          - us-east-1
          - eu-west-1
          - ap-southeast-1

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.7.5'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # Remote state backend (S3 + DynamoDB locking). The bucket and lock table
  # must be bootstrapped first — see infrastructure/terraform/bootstrap/README.md.
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  terraform:
    name: Terraform (${{ github.event.inputs.environment || 'us-east-1' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [us-east-1, eu-west-1, ap-southeast-1]
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init (remote backend)
        run: |
          set -euo pipefail
          if [ -z "${TF_STATE_BUCKET:-}" ] || [ -z "${TF_LOCK_TABLE:-}" ]; then
            echo "::error::TF_STATE_BUCKET and TF_LOCK_TABLE repository variables must be set. Run the bootstrap module first (infrastructure/terraform/bootstrap)."
            exit 1
          fi
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${GITHUB_REPOSITORY}/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Verify remote state (fail on local state)
        run: |
          set -euo pipefail
          # A configured backend must be present; otherwise Terraform silently
          # falls back to local state and plan/apply would be unprotected.
          if ! terraform state pull >/dev/null 2>&1; then
            echo "::error::Unable to read remote state. Backend is not configured or locking failed."
            exit 1
          fi
          if [ -f terraform.tfstate ] || [ -f terraform.tfstate.backup ]; then
            echo "::error::Local state file detected. Refusing to plan against local state."
            exit 1
          fi
          BACKEND_TYPE=$(terraform version -json >/dev/null 2>&1; grep -R "backend \"" .terraform/terraform.tfstate 2>/dev/null || true)
          if [ -z "${BACKEND_TYPE}" ]; then
            echo "::error::No remote backend detected in .terraform/terraform.tfstate. Configure the S3 backend before running plan."
            exit 1
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -lock-timeout=5m tfplan
