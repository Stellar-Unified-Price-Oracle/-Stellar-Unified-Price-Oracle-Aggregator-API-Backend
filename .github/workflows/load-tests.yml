name: Load Tests
concurrency:
  group: load-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API base URL to test against'
        required: false
        default: 'http://localhost:3000'
      scenario:
        description: 'k6 script to run'
        required: false
        default: 'api-benchmark'
  pull_request:
    paths:
      - 'api/**'
      - 'load-tests/**'
      - 'monitoring/slo.yml'
      - '.github/workflows/load-tests.yml'
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2am

jobs:
  # Short-tier gate: runs on relevant PRs and fails the run on threshold breach.
  load-test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: price_oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/price_oracle
          PORT: 3000
          NODE_ENV: test
        run: |
          npm run build --workspace=api 2>/dev/null || true
          npm start --workspace=api &
          sleep 5

      - name: Wait for API
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/v1/health/live && break
            sleep 2
          done

      - name: Run k6 short-tier gate
        run: |
          k6 run \
            --env BASE_URL="http://localhost:3000" \
            --env TIER=short \
            --out json=load-tests/results/summary.json \
            load-tests/k6/api-benchmark.js

      - name: Compare against baseline
        run: node load-tests/compare-baseline.js load-tests/results/summary.json load-tests/baseline.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-pr
          path: load-tests/results/

  # Full scenario set on a schedule (or pre-release); fails on threshold breach.
  load-test-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: price_oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/price_oracle
          PORT: 3000
          NODE_ENV: test
        run: |
          npm run build --workspace=api 2>/dev/null || true
          npm start --workspace=api &
          sleep 5

      - name: Wait for API
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/v1/health/live && break
            sleep 2
          done

      - name: Run full k6 scenario set
        run: |
          SCRIPT="${{ github.event.inputs.scenario || 'api-benchmark' }}"
          k6 run \
            --env BASE_URL="${{ github.event.inputs.base_url || 'http://localhost:3000' }}" \
            --env TIER=full \
            --out json=load-tests/results/summary.json \
            load-tests/k6/${SCRIPT}.js

      - name: Compare against baseline
        run: node load-tests/compare-baseline.js load-tests/results/summary.json load-tests/baseline.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-full
          path: load-tests/results/

  record-outcome:
    name: Record drill outcome
    if: always() && github.event_name == 'schedule'
    needs: [load-test-pr, load-test-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DRILL_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        with:
          script: |
            const status = process.env.DRILL_STATUS;
            const body = [
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Status: ${status}`,
              'Record the achieved RTO/RPO in docs/operations/DRILL_LOG.md.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[drill] load-tests ${new Date().toISOString().slice(0, 10)}: ${status}`,
              body,
              labels: ['drill-outcome', 'operations'],
            });
