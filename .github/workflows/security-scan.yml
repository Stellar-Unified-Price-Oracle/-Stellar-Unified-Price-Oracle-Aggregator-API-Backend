name: Container Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # Re-scan the latest image nightly to catch newly-published CVEs
    - cron: "0 3 * * *"

env:
  # The image is built locally and loaded for scanning, so the tag never has to
  # be a valid registry reference (GHCR rejects this repo's uppercase owner).
  IMAGE_NAME: stellar-oracle-api
  IMAGE_TAG: scan-${{ github.sha }}

jobs:
  build-image:
    name: Build Image for Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load into daemon for scanning)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tar for upload
        run: |
          docker save "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  trivy-scan:
    name: Trivy Vulnerability Scan
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Run Trivy — SARIF (for GitHub Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"   # don't fail here; fail on the table scan below

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy — table output (human-readable)
        id: trivy_table
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          output: trivy-table.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # capture output; gate below

      - name: Run Trivy — CRITICAL gate (fail the job)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"   # fail on any CRITICAL unfixed CVE

      - name: Generate PR comment body
        if: github.event_name == 'pull_request'
        id: comment_body
        run: |
          REPORT=$(cat trivy-table.txt)
          {
            echo "body<<EOF"
            echo "## Container Security Scan Results"
            echo ""
            echo "**Image:** \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`"
            echo "**Scan date:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if grep -q "Total: 0" trivy-table.txt 2>/dev/null || [ -z "$REPORT" ]; then
              echo "No CRITICAL or HIGH vulnerabilities found."
            else
              echo "<details><summary>CRITICAL / HIGH findings</summary>"
              echo ""
              echo '```'
              echo "$REPORT"
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "_Full report available in the [Security tab](../security/code-scanning)._"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-scan
          message: ${{ steps.comment_body.outputs.body }}

      - name: Upload full report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-results.sarif
            trivy-table.txt
          retention-days: 30
