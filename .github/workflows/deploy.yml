name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      slo_override_reason:
        description: "Emergency override reason to bypass SLO error-budget gate"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      api-tag: ${{ steps.tags.outputs.api-sha }}
      aggregator-tag: ${{ steps.tags.outputs.aggregator-sha }}
      api-image: ${{ steps.tags.outputs.api-base }}
      aggregator-image: ${{ steps.tags.outputs.aggregator-base }}
      api-digest: ${{ steps.build-api.outputs.digest }}
      aggregator-digest: ${{ steps.build-aggregator.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "value=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        env:
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          # GHCR requires lowercase path segments and rejects a leading dash;
          # this repository's name starts with one, so derive the image path
          # from a lowercased owner instead of $GITHUB_REPOSITORY.
          NAMESPACE=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          API_BASE="${REGISTRY}/${NAMESPACE}/stellar-oracle-api"
          AGG_BASE="${REGISTRY}/${NAMESPACE}/stellar-oracle-aggregator"
          echo "api-base=${API_BASE}" >> "$GITHUB_OUTPUT"
          echo "aggregator-base=${AGG_BASE}" >> "$GITHUB_OUTPUT"
          echo "api-sha=${API_BASE}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "aggregator-sha=${AGG_BASE}:sha-${SHA}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api-main=${API_BASE}:main" >> "$GITHUB_OUTPUT"
            echo "api-latest=${API_BASE}:latest" >> "$GITHUB_OUTPUT"
            echo "aggregator-main=${AGG_BASE}:main" >> "$GITHUB_OUTPUT"
            echo "aggregator-latest=${AGG_BASE}:latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "api-develop=${API_BASE}:develop" >> "$GITHUB_OUTPUT"
            echo "aggregator-develop=${AGG_BASE}:develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.api-sha }}
            ${{ steps.tags.outputs.api-main }}
            ${{ steps.tags.outputs.api-latest }}
            ${{ steps.tags.outputs.api-develop }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Aggregator image
        id: build-aggregator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/aggregator/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.aggregator-sha }}
            ${{ steps.tags.outputs.aggregator-main }}
            ${{ steps.tags.outputs.aggregator-latest }}
            ${{ steps.tags.outputs.aggregator-develop }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign API image (keyless)
        run: cosign sign --yes "${{ steps.tags.outputs.api-base }}@${{ steps.build-api.outputs.digest }}"

      - name: Sign Aggregator image (keyless)
        run: cosign sign --yes "${{ steps.tags.outputs.aggregator-base }}@${{ steps.build-aggregator.outputs.digest }}"

      - name: Generate SLSA provenance — API image
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.tags.outputs.api-base }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Generate SLSA provenance — Aggregator image
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.tags.outputs.aggregator-base }}
          subject-digest: ${{ steps.build-aggregator.outputs.digest }}
          push-to-registry: true

  verify-images:
    name: Verify image signatures
    needs: [build-images]
    runs-on: ubuntu-latest
    permissions:
      packages: read
      id-token: write
    steps:
      # cosign pulls the image to inspect its signatures, and the GHCR
      # package is not public, so the job has to authenticate first.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Reject unsigned API image
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ needs.build-images.outputs.api-image }}@${{ needs.build-images.outputs.api-digest }}"

      - name: Reject unsigned Aggregator image
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ needs.build-images.outputs.aggregator-image }}@${{ needs.build-images.outputs.aggregator-digest }}"

  deploy-dev:
    name: Deploy to Dev
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [build-images, verify-images]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Check KUBECONFIG_DEV is configured
        id: guard
        env:
          KUBECONFIG_VALUE: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          if [ -z "$KUBECONFIG_VALUE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBECONFIG_DEV is not set — skipping the dev deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        if: steps.guard.outputs.configured == 'true'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        if: steps.guard.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config

      - name: Deploy to dev
        if: steps.guard.outputs.configured == 'true'
        run: |
          bash scripts/deploy-k8s.sh dev \
            "${{ needs.build-images.outputs.api-tag }}" \
            "${{ needs.build-images.outputs.aggregator-tag }}"

  deploy-staging:
    name: Deploy to Staging
    if: >
      ( github.ref == 'refs/heads/main' && github.event_name == 'push' ) ||
      ( github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' )
    needs: [build-images, verify-images]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Check KUBECONFIG_STAGING is configured
        id: guard
        env:
          KUBECONFIG_VALUE: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          if [ -z "$KUBECONFIG_VALUE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBECONFIG_STAGING is not set — skipping the staging deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        if: steps.guard.outputs.configured == 'true'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        if: steps.guard.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > ~/.kube/config

      - name: Gate release on SLO error-budget burn rate (#552)
        if: steps.guard.outputs.configured == 'true'
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL || 'http://prometheus.monitoring.svc:9090' }}
          SLO_OVERRIDE_REASON: ${{ github.event.inputs.slo_override_reason }}
          SLO_OVERRIDE_APPROVER: ${{ github.actor }}
        run: |
          node scripts/slo-release-gate.ts --environment=staging || {
            echo "::error::Staging deployment blocked by SLO error-budget release gate (#552)"
            exit 1
          }

      - name: Deploy to staging
        if: steps.guard.outputs.configured == 'true'
        run: |
          bash scripts/deploy-k8s.sh staging \
            "${{ needs.build-images.outputs.api-tag }}" \
            "${{ needs.build-images.outputs.aggregator-tag }}"

  deploy-prod:
    name: Deploy to Production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    needs: [build-images, verify-images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check KUBECONFIG_PROD is configured
        id: guard
        env:
          KUBECONFIG_VALUE: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          if [ -z "$KUBECONFIG_VALUE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBECONFIG_PROD is not set — skipping the production deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        if: steps.guard.outputs.configured == 'true'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        if: steps.guard.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config

      - name: Gate release on SLO error-budget burn rate (#552)
        if: steps.guard.outputs.configured == 'true'
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL || 'http://prometheus.monitoring.svc:9090' }}
          SLO_OVERRIDE_REASON: ${{ github.event.inputs.slo_override_reason }}
          SLO_OVERRIDE_APPROVER: ${{ github.actor }}
        run: |
          node scripts/slo-release-gate.ts --environment=production || {
            echo "::error::Production deployment blocked by SLO error-budget release gate (#552)"
            exit 1
          }

      - name: Deploy to production
        if: steps.guard.outputs.configured == 'true'
        run: |
          bash scripts/deploy-k8s.sh prod \
            "${{ needs.build-images.outputs.api-tag }}" \
            "${{ needs.build-images.outputs.aggregator-tag }}"
