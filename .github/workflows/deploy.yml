name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      api-tag: ${{ steps.tags.outputs.api-sha }}
      aggregator-tag: ${{ steps.tags.outputs.aggregator-sha }}
      api-digest: ${{ steps.build-api.outputs.digest }}
      aggregator-digest: ${{ steps.build-aggregator.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "value=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        env:
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          API_BASE="$REGISTRY/$GITHUB_REPOSITORY/api"
          AGG_BASE="$REGISTRY/$GITHUB_REPOSITORY/aggregator"
          echo "api-sha=${API_BASE}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "aggregator-sha=${AGG_BASE}:sha-${SHA}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api-main=${API_BASE}:main" >> "$GITHUB_OUTPUT"
            echo "api-latest=${API_BASE}:latest" >> "$GITHUB_OUTPUT"
            echo "aggregator-main=${AGG_BASE}:main" >> "$GITHUB_OUTPUT"
            echo "aggregator-latest=${AGG_BASE}:latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "api-develop=${API_BASE}:develop" >> "$GITHUB_OUTPUT"
            echo "aggregator-develop=${AGG_BASE}:develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ steps.tags.outputs.api-sha }}
            ${{ steps.tags.outputs.api-main }}
            ${{ steps.tags.outputs.api-latest }}
            ${{ steps.tags.outputs.api-develop }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Aggregator image
        id: build-aggregator
        uses: docker/build-push-action@v6
        with:
          context: services/aggregator
          push: true
          tags: |
            ${{ steps.tags.outputs.aggregator-sha }}
            ${{ steps.tags.outputs.aggregator-main }}
            ${{ steps.tags.outputs.aggregator-latest }}
            ${{ steps.tags.outputs.aggregator-develop }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign API image (keyless)
        run: cosign sign --yes "${REGISTRY}/${GITHUB_REPOSITORY}/api@${{ steps.build-api.outputs.digest }}"

      - name: Sign Aggregator image (keyless)
        run: cosign sign --yes "${REGISTRY}/${GITHUB_REPOSITORY}/aggregator@${{ steps.build-aggregator.outputs.digest }}"

      - name: Generate SLSA provenance — API image
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Generate SLSA provenance — Aggregator image
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/aggregator
          subject-digest: ${{ steps.build-aggregator.outputs.digest }}
          push-to-registry: true

  verify-images:
    name: Verify image signatures
    needs: [build-images]
    runs-on: ubuntu-latest
    permissions:
      packages: read
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Reject unsigned API image
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${GITHUB_REPOSITORY}/api@${{ needs.build-images.outputs.api-digest }}"

      - name: Reject unsigned Aggregator image
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${GITHUB_REPOSITORY}/aggregator@${{ needs.build-images.outputs.aggregator-digest }}"

  deploy-dev:
    name: Deploy to Dev
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [build-images, verify-images]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config

      - name: Deploy to dev
        run: |
          bash scripts/deploy-k8s.sh dev \
            "${{ needs.build-images.outputs.api-tag }}" \
            "${{ needs.build-images.outputs.aggregator-tag }}"

  deploy-staging:
    name: Deploy to Staging
    if: >
      ( github.ref == 'refs/heads/main' && github.event_name == 'push' ) ||
      ( github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' )
    needs: [build-images, verify-images]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > ~/.kube/config

      - name: Deploy to staging
        run: |
          bash scripts/deploy-k8s.sh staging \
            "${{ needs.build-images.outputs.api-tag }}" \
            "${{ needs.build-images.outputs.aggregator-tag }}"

  deploy-prod:
    name: Deploy to Production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    needs: [build-images, verify-images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config

      - name: Deploy to production
        run: |
          bash scripts/deploy-k8s.sh prod \
            "${{ needs.build-images.outputs.api-tag }}" \
            "${{ needs.build-images.outputs.aggregator-tag }}"
