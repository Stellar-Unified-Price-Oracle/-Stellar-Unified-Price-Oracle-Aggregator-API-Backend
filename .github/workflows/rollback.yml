name: Rollback
concurrency:
  group: rollback-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to rollback
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      commit-sha:
        description: Commit SHA to rollback to (default = previous commit on main)
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  REF: ${{ github.sha }}

jobs:
  rollback:
    if: github.event_name == 'workflow_dispatch'
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || github.event.inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine rollback SHA
        id: sha
        run: |
          if [ -n "${{ github.event.inputs.commit-sha }}" ]; then
            echo "value=${{ github.event.inputs.commit-sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve rollback image tags
        id: images
        env:
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          API_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/api:sha-${SHA:0:7}"
          AGGREGATOR_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/aggregator:sha-${SHA:0:7}"
          echo "api-image=${API_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "aggregator-image=${AGGREGATOR_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Prepare environment variables
        id: prep
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "env_upper=$(echo "$ENV" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        env:
          KUBECONFIG_VALUE: ${{ secrets[format('KUBECONFIG_{0}', steps.prep.outputs.env_upper)] }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBECONFIG_VALUE}" > ~/.kube/config

      - name: Freeze aggregator
        run: |
          FREEZE_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "FREEZE_TIMESTAMP=${FREEZE_TS}" >> "$GITHUB_ENV"
          echo "Freeze timestamp: ${FREEZE_TS}"
          kubectl scale deployment/aggregator \
            --replicas=0 \
            -n "stellar-oracle-${{ github.event.inputs.environment }}"

      - name: Deploy rollback images
        run: |
          bash scripts/deploy-k8s.sh \
            "${{ github.event.inputs.environment }}" \
            "${{ steps.images.outputs.api-image }}" \
            "${{ steps.images.outputs.aggregator-image }}"

      - name: Verify rollback
        run: |
          echo "Rollback to ${{ steps.sha.outputs.value }} on ${{ github.event.inputs.environment }} complete."
          kubectl rollout status deployment -n "stellar-oracle-${{ github.event.inputs.environment }}" \
            --timeout=120s \
            api-stable aggregator

  # Weekly dry-run drill (consolidated from rollback-drill.yml, issue #627).
  rollback-drill:
    if: github.event_name == 'schedule'
    name: Weekly Rollback Drill (staging, dry-run)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record drill start time
        id: start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run rollback script in dry-run mode
        env:
          ROLLBACK_DRY_RUN: "true"
          REPO: ${{ github.repository }}
        run: |
          mkdir -p logs
          bash scripts/rollback.sh staging 2>&1 | tee logs/drill-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Compute simulated TTR
        id: ttr
        run: |
          start_ts=${{ steps.start.outputs.ts }}
          end_ts=$(date +%s)
          ttr=$(( end_ts - start_ts ))
          echo "ttr=${ttr}" >> "$GITHUB_OUTPUT"
          echo "ttr_readable=$(printf '%dm %ds' $((ttr/60)) $((ttr%60)))" >> "$GITHUB_OUTPUT"

      - name: Generate drill report
        run: |
          cat > logs/drill-report.md <<EOF
          # Rollback Drill Report

          **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Environment:** staging (dry-run)
          **Triggered by:** ${{ github.event_name }}
          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Result

          | Item | Value |
          |------|-------|
          | Simulated TTR | ${{ steps.ttr.outputs.ttr_readable }} (${{ steps.ttr.outputs.ttr }}s) |
          | TTR target | < 600s (10 min) |
          | Target met | $([ ${{ steps.ttr.outputs.ttr }} -le 600 ] && echo "✅ Yes" || echo "❌ No") |
          | Dry-run mode | true |
          | Rollback SHA | $(git rev-parse HEAD~1 2>/dev/null || echo "n/a") |

          ## Script output

          \`\`\`
          $(cat logs/drill-output.log)
          \`\`\`

          ## Event log

          \`\`\`
          $(cat logs/rollback-events.log 2>/dev/null || echo "(no events logged)")
          \`\`\`
          EOF

      - name: Upload drill report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drill-report-${{ github.run_id }}
          path: logs/drill-report.md
          retention-days: 90

      - name: Post summary to job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Rollback Drill — $(date -u +%Y-%m-%d)

          | Item | Value |
          |------|-------|
          | Environment | staging (dry-run) |
          | Simulated TTR | ${{ steps.ttr.outputs.ttr_readable }} |
          | TTR target | < 10 min |
          | Target met | $([ ${{ steps.ttr.outputs.ttr }} -le 600 ] && echo "✅ Yes" || echo "❌ No") |

          See the **drill-report** artifact for full script output and event log.
          EOF

      - name: Record drill outcome
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          DRILL_STATUS: ${{ job.status }}
          DRILL_TTR: ${{ steps.ttr.outputs.ttr_readable }}
        with:
          script: |
            const status = process.env.DRILL_STATUS;
            const body = [
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Status: ${status}`,
              `Simulated TTR: ${process.env.DRILL_TTR || 'n/a'} (target < 10 min)`,
              `Environment: staging (dry-run)`,
              '',
              'Outcome is durable here and in the drill-report artifact.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[drill] rollback ${new Date().toISOString().slice(0, 10)}: ${status}`,
              body,
              labels: ['drill-outcome', 'operations'],
            });
